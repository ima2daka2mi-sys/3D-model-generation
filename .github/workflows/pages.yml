name: Publish to gh-pages

# GitHub Pages serves the gh-pages branch. Mirror this branch into it on every
# push so the public viewer always shows the latest version.
on:
  push:
    branches: [claude/3d-space-panel-viewer-om07rl]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:refs/heads/gh-pages
